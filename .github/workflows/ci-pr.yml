name: PR CI (tests & build)

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # @testing-library/jest-dom@7 要求 Node >= 22，与本地开发环境对齐
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: |
          corepack enable
          yarn --version
          yarn install --frozen-lockfile

      - name: Run lint
        run: |
          yarn lint

      - name: Run typecheck
        run: |
          yarn typecheck

      - name: Run format check
        run: |
          yarn format:check

      - name: Run unit tests
        run: |
          yarn test:coverage

      - name: Install CJK fonts
        # runner 默认无中文字体，视觉快照基线在本机（Noto Sans CJK）生成，需对齐字体环境
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Playwright Chromium
        run: |
          yarn playwright install --with-deps chromium

      - name: Run browser tests
        run: |
          yarn test:e2e

      - name: Build (lib + demo)
        run: |
          yarn build
          yarn build:demo
