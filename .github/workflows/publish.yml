name: Publish to npm (tags)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - components
          - components-pro
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Classify tag and prepare env
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Detected tag: $TAG"

          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          PKG_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/${{ matrix.package }}/package.json','utf8')).name)")
          PKG_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/${{ matrix.package }}/package.json','utf8')).version)")
          echo "PKG_NAME=$PKG_NAME" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag version $VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

          if [[ "$PKG_VERSION" =~ -dev ]]; then
            PUBLISH_TAG=dev
            echo "Version type: Dev Pre-release"
          elif [[ "$PKG_VERSION" =~ -beta ]]; then
            PUBLISH_TAG=beta
            echo "Version type: Beta Pre-release"
          else
            PUBLISH_TAG=latest
            echo "Version type: Release"
          fi

          echo "PUBLISH_TAG=$PUBLISH_TAG" >> "$GITHUB_ENV"
          echo "Tag version: $VERSION"
          echo "Package version: $PKG_VERSION"
          echo "Publish tag: $PUBLISH_TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Install dependencies
        run: |
          corepack enable
          yarn --version
          yarn install --frozen-lockfile

      - name: Check if version already published
        id: version
        shell: bash
        run: |
          echo "Package: $PKG_NAME"
          echo "Version: $PKG_VERSION"
          if npm view "$PKG_NAME@$PKG_VERSION" version > /dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION already exists on npm, skip publishing."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION not found on npm, will publish."
          fi

      - name: Verify npm authentication
        if: steps.version.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPM_TOKEN is empty or unavailable in this workflow."
            exit 1
          fi

          echo "Registry: $(npm config get registry)"
          npm whoami

      - name: Build package
        if: steps.version.outputs.should_publish == 'true'
        run: |
          yarn workspace "@hamster-note/${{ matrix.package }}" build

      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          npm publish "packages/${{ matrix.package }}" --tag "$PUBLISH_TAG" --access public

      - name: Ensure pre-release dist-tag
        if: (env.PUBLISH_TAG == 'dev' || env.PUBLISH_TAG == 'beta') && steps.version.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          echo "Ensure dist-tag: ${PUBLISH_TAG} -> $PKG_VERSION"
          npm dist-tag add "$PKG_NAME@$PKG_VERSION" "$PUBLISH_TAG" || true
          npm dist-tag ls "$PKG_NAME"
